name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint and Prettier
        run: npx eslint . && npx prettier --check .
      - name: web-ext lint
        run: npm run lint:ext
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
