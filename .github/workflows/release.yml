name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check that the tag matches the manifest version
        run: |
          manifest_version="$(node -p "require('./src/manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ] || [ "${manifest_version}" != "${package_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME}, manifest ${manifest_version} and package ${package_version} must match"
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pr-tab-groups-${{ github.ref_name }}
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
      # The release may already exist when it was created from the GitHub web UI.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" web-ext-artifacts/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" web-ext-artifacts/*.zip --verify-tag --generate-notes
          fi
